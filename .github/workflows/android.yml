name: Native Android
on: [push, pull_request]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: python android/build.py --sdk "$ANDROID_HOME" --server https://native-fixture.invalid
      - run: python android/test_native.py --sdk "$ANDROID_HOME"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 0
            adb shell settings put system screen_off_timeout 600000
            adb shell svc power stayon true
            # First-boot Monet overlays replace resources and recreate activities.
            # Let user-unlock/theme initialization settle before instrumenting.
            sleep 20
            adb install -r dist/alba-albi.apk
            adb install -r android/build/smoke/native-smoke.apk
            adb shell am instrument -w local.alba.smoke/local.alba.NativeUiSmoke > native-ui-result.txt
            cat native-ui-result.txt
            adb logcat -d > native-ui-logcat.txt
            grep -q 'PASS:' native-ui-result.txt
      - name: Compile public-origin release candidate
        run: python android/build.py --sdk "$ANDROID_HOME" --server https://dvlce.tail3d18fa.ts.net --output dist/alba-candidate.apk
      - uses: actions/upload-artifact@v4
        with:
          name: native-release-candidate
          path: dist/alba-candidate.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-test-report
          path: |
            native-ui-result.txt
            native-ui-logcat.txt
