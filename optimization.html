<section id="info"><div class="info-grid"><article class="card"><p class="eyebrow">ALBA SSD Runtime</p><h2 data-it="Il modello che scegli." data-en="The model you choose."></h2><p data-it="Il runtime legge lo stesso file GGUF Q4 da SSD. Non sostituisce il modello con uno più piccolo. La cache KV resta f16; il draft opzionale propone token verificati dal modello principale." data-en="The runtime reads the same Q4 GGUF from SSD. It does not substitute a smaller model. KV stays f16; an optional draft proposes tokens verified by the target model."></p></article><article class="card"><p class="eyebrow" data-it="Stato: sperimentale" data-en="Status: experimental"></p><h2 data-it="Limiti visibili." data-en="Visible limits."></h2><p data-it="SSD e RAM hanno velocità diverse. Sul Pi da 8 GB il 14B da 8,99 GB gira, ma solo a circa 0,10 token/s. Anche la chat lunga con 7B resta lenta. Le ottimizzazioni non migliorano ogni richiesta." data-en="SSD and RAM have different bandwidth. On the 8 GB Pi the 8.99 GB 14B runs at only about 0.10 token/s. Long-history 7B chat remains slow. Optimizations do not improve every request."></p></article></div><article class="card"><h2 data-it="Prova e verifica." data-en="Try and verify."></h2><p data-it="La Test Lab amministratore confronta Ollama normale e SSD con lo stesso modello e prompt. Risposte, latenza, velocità, risorse e fallimenti restano consultabili. Le prove private non vengono pubblicate qui." data-en="The administrator Test Lab compares normal Ollama and SSD using the same model and prompt. Outputs, latency, speed, resources and failures remain inspectable. Private tests are not published here."></p><div class="links"><a href="/notte#lab" data-it="Apri Test Lab" data-en="Open Test Lab"></a><a href="/optimization/reports/SSD_RUNTIME.md" data-it="Architettura e configurazione" data-en="Architecture and configuration"></a><a href="https://github.com/Dvlce/alba-tramonto" rel="noopener noreferrer">GitHub ↗</a></div></article></section
