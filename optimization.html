<section id="info"><div class="info-grid"><article class="card"><p class="eyebrow">ALBA SSD Runtime</p><h2 data-it="Il modello che scegli." data-en="The model you choose."></h2><p data-it="Il runtime legge lo stesso file GGUF Q4 da SSD. Non sostituisce il modello con uno più piccolo. SSD e Draft usano cache f16; KV8 usa cache q8. Il draft propone token verificati dal modello principale." data-en="The runtime reads the same Q4 GGUF from SSD. It does not substitute a smaller model. SSD and Draft use f16 KV; KV8 uses q8 KV. The draft proposes tokens verified by the target model."></p></article><article class="card"><p class="eyebrow" data-it="Stato: sperimentale" data-en="Status: experimental"></p><h2 data-it="Limiti visibili." data-en="Visible limits."></h2><p data-it="SSD e RAM hanno velocità diverse. Sul Pi da 8 GB il 14B da 8,99 GB gira, ma solo a circa 0,10 token/s. Anche la chat lunga con 7B resta lenta. Le ottimizzazioni non migliorano ogni richiesta." data-en="SSD and RAM have different bandwidth. On the 8 GB Pi the 8.99 GB 14B runs at only about 0.10 token/s. Long-history 7B chat remains slow. Optimizations do not improve every request."></p></article></div><article class="card"><h2 data-it="Prova e verifica." data-en="Try and verify."></h2><p data-it="La Test Lab amministratore confronta Ollama normale e SSD con lo stesso modello e prompt. Risposte, latenza, velocità, risorse e fallimenti restano consultabili. Le prove private non vengono pubblicate qui." data-en="The administrator Test Lab compares normal Ollama and SSD using the same model and prompt. Outputs, latency, speed, resources and failures remain inspectable. Private tests are not published here."></p><div class="links"><a href="/notte#lab" data-it="Apri Test Lab" data-en="Open Test Lab"></a><a href="/optimization/reports/SSD_RUNTIME.md" data-it="Architettura e configurazione" data-en="Architecture and configuration"></a><a href="https://github.com/Dvlce/alba-tramonto" rel="noopener noreferrer">GitHub ↗</a></div></article></section>

<section id="benchmarks" hidden><article class="card" id="onlineLab"><p class="eyebrow">Test online · Raspberry Pi</p><h2 data-it="Prima standard, poi la tua ottimizzazione." data-en="Standard first, then your chosen optimization."></h2><p data-it="Stesso modello e prompt. Le prove girano sul tuo Raspberry e restano private. Standard viene eseguito per primo: il secondo percorso può beneficiare della cache. Flux modifica il budget della risposta; KV8 modifica la precisione della cache." data-en="Same model and prompt. Tests run on your Raspberry and stay private. Standard runs first: the second path may benefit from cache. Flux changes response budgets; KV8 changes cache precision."></p><button id="onlineActivate" type="button" data-it="Apri test amministratore" data-en="Open administrator test"></button><p id="onlineState" role="status" aria-live="polite"></p><form id="onlineForm" hidden><div class="online-controls"><label><span data-it="Modello installato" data-en="Installed model"></span><select id="onlineModel" required></select></label><label><span data-it="Ottimizzazione scelta" data-en="Chosen optimization"></span><select id="onlinePolicy"><option value="adaptive">Notte Flux · token/context</option><option value="mapped">Notte SSD · mmap</option><option value="native">Notte ARM · repack</option><option value="compact">Notte KV8 · q8 cache</option><option value="speculative">Notte Draft · verified draft</option><option value="warm">Notte Warm · resident</option><option value="cpu2">Notte CPU2 · 2 threads</option></select></label><label>Context<select id="onlineContext"><option>512</option><option selected>1024</option><option>2048</option></select></label><label>Output tokens<input id="onlineOutput" type="number" min="8" max="256" value="96" required></label></div><label for="onlinePrompt" data-it="Prompt condiviso" data-en="Shared prompt"></label><textarea id="onlinePrompt" rows="4" maxlength="2000" required></textarea><div class="links"><button id="onlineRun" type="submit" data-it="1. Standard → 2. Ottimizzazione" data-en="1. Standard → 2. Optimization"></button><button id="onlineStop" type="button" disabled data-it="Interrompi il mio test" data-en="Stop my test"></button></div></form><div id="onlineResults" aria-live="polite"></div></article><article class="card"><p class="eyebrow">Notte 1.5 · Raspberry Pi 5 · Coder 7B</p><h2 data-it="Sette strategie, attesa totale e risultati verificabili." data-en="Seven strategies, total wait and inspectable results."></h2><p data-it="Una campagna sullo stesso modello reale: ogni strategia segue la sua prova standard. Istogrammi di primo token, attesa totale, generazione e token di output. Le prove fallite sono indicate come N/A; i controlli Python e aritmetici sono nel report." data-en="One campaign on the same actual model: each strategy follows its standard run. Bar charts show first token, total wait, decode and output tokens. Failed trials are marked N/A; Python and arithmetic checks are in the report."></p><div class="chart-box"><img src="/optimization/reports/adaptive-coding.svg" alt="Seven coding comparisons: standard versus selected strategy, with failed ARM test" width="2380" height="1530" loading="lazy"></div><div id="adaptiveTable" class="table-wrap"></div><h3 data-it="Input lungo: confronto dell’attesa" data-en="Long input: waiting time comparison"></h3><div class="chart-box"><img src="/optimization/reports/adaptive-long-wait.svg" alt="Long input comparison: SSD, Warm and Flux versus standard" width="2380" height="1530" loading="lazy"></div><p data-it="Una ripetizione per condizione, standard sempre prima, avvio incluso e cache del sistema operativo non svuotata. Warm riusa modello e prompt; Flux cambia istruzioni e budget; KV8 cambia la precisione della cache. Non è una classifica generale d’intelligenza." data-en="One repetition per condition, standard always first, startup included and OS cache not evicted. Warm reuses model and prompt; Flux changes instructions and budgets; KV8 changes cache precision. This is not a general intelligence ranking."></p><div class="links"><a href="/optimization/reports/ADAPTIVE_RESULTS.md" data-it="Report completo 1.5" data-en="Full 1.5 report"></a><a href="/optimization/reports/ADAPTIVE_RESULTS.json" download>JSON</a><a href="/optimization/reports/adaptive-coding.svg" download data-it="Istogrammi coding" data-en="Coding bar charts"></a><a href="/optimization/reports/adaptive-long-wait.svg" download data-it="Istogrammi attesa lunga" data-en="Long-wait bar charts"></a><a href="/optimization/reports/ADAPTIVE_RUNTIME.md" data-it="Tecnologie e configurazione" data-en="Technology and configuration"></a></div></article><article class="card"><p class="eyebrow">Test Lab · Qwen2.5-Coder 7B</p><h2 data-it="Normale e SSD: confronto sul Raspberry" data-en="Normal and SSD: comparison on the Raspberry"></h2><p data-it="Una prova aritmetica reale, entrambi rispondono 42. Primo token: 21,10 s con Ollama, 15,17 s con SSD. Richiesta totale: 21,93 contro 15,91 s; generazione: 3,63 contro 2,69 token/s, quindi SSD è più lento nel decode." data-en="One actual arithmetic probe, both answer 42. First token: 21.10 s with Ollama, 15.17 s with SSD. Total request: 21.93 versus 15.91 s; generation: 3.63 versus 2.69 tokens/s, so SSD decodes more slowly."></p><div class="chart-box lab-public-figure"><img src="/optimization/reports/test-lab-comparison.svg" alt="Normal Ollama versus SSD: first token 21.10/15.17 s, total 21.93/15.91 s, decode 3.63/2.69 token/s" width="2040" height="816" loading="lazy"></div><p data-it="Una sola prova; normale eseguito per primo, avvio incluso, cache del sistema operativo non svuotata. Non dimostra un vantaggio generale o una maggiore intelligenza. Grafici e dati di questa pagina provengono da prove pubblicate esplicitamente, mai dalla cronologia privata." data-en="One probe; normal runs first, startup included, OS cache not cleared. This does not demonstrate a general advantage or greater intelligence. Charts and data here come from explicitly published probes, never private history."></p><div class="links"><a href="/optimization/reports/TEST_LAB_RESULTS.md" data-it="Report della Test Lab" data-en="Test Lab report"></a><a href="/optimization/reports/TEST_LAB_RESULTS.json" download data-it="Misure JSON" data-en="Measurements JSON"></a><a href="/optimization/reports/test-lab-comparison.svg" download data-it="Istogramma SVG" data-en="Bar chart SVG"></a></div></article><h2 data-it="Le misure, anche quando peggiorano." data-en="The measurements, including regressions."></h2><p data-it="Pi 5 · 8 GB · NVMe · CPU. Piccoli prompt pubblici ripetuti; temperatura 0. Il confronto sotto è mapped contro draft verificato, entrambi sullo stesso 7B, non Ollama contro SSD." data-en="Pi 5 · 8 GB · NVMe · CPU. Small repeated public prompts; temperature 0. Below: mapped versus verified draft on the same 7B, not Ollama versus SSD."></p><div id="publicChart" class="chart-box"></div><div id="benchmarkTable" class="table-wrap"></div><article class="card"><h3 data-it="La chat completa resta lenta" data-en="Full chat remains slow"></h3><p data-it="Ultima prova reale con cronologia: primo token dopo 250 secondi. Il checkpoint breve scende da 7,424 a 2,135 secondi, esclusi avvio e I/O, ma non dimostra una chat fluida. Il 14B ha fallito la prova della funzione Python." data-en="Latest actual history-inclusive chat: first token after 250 seconds. The short checkpoint probe drops from 7.424 to 2.135 seconds excluding startup and I/O, but does not establish fluid chat. The 14B failed the Python function probe."></p></article><div class="links"><a href="/optimization/reports/SSD_RUNTIME_RESULTS.md" data-it="Report completo" data-en="Full report"></a><a href="/optimization/reports/SSD_RUNTIME_RESULTS.json" download data-it="Dati JSON" data-en="JSON data"></a><a href="/optimization/reports/7b-decode.svg" download data-it="Grafico SVG" data-en="SVG chart"></a></div></section>
